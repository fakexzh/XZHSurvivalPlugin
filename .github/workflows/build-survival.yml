name: Build XZH Survival Plugin

on:
  push:
    branches: [main, master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle --no-daemon clean build
      - name: Verify villager dialogue was removed
        run: |
          test -f build/libs/XZHSurvivalPlugin-1.0.0.jar
          if jar tf build/libs/XZHSurvivalPlugin-1.0.0.jar | grep -Eq 'VillagerBubbleStoryManager.class|villager-dialogue.yml'; then
            echo "Villager story dialogue still exists in the JAR"
            exit 1
          fi
          if grep -R -n -E 'VillagerBubbleStoryManager|villager-bubble-chat|villager-dialogue.yml' src/main; then
            echo "Villager story dialogue references remain in source"
            exit 1
          fi
          echo "Verified: villager story/bubble dialogue removed"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: XZHSurvivalPlugin-1.0.0
          path: build/libs/XZHSurvivalPlugin-1.0.0.jar
          if-no-files-found: error
          retention-days: 90
