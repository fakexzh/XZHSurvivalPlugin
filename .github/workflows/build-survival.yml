name: Build XZH Survival Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle --no-daemon clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: XZHSurvivalPlugin-1.0.0
          path: build/libs/XZHSurvivalPlugin-1.0.0.jar
          if-no-files-found: error
