name: Build Villager Bubble Feature

on:
  push:
    branches:
      - feature/banglish-villager-bubble-stories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle --no-daemon clean build
      - name: Verify plugin JAR
        run: |
          test -f build/libs/XZHSurvivalPlugin-1.0.0.jar
          jar tf build/libs/XZHSurvivalPlugin-1.0.0.jar | grep -q 'VillagerBubbleStoryManager.class'
          jar tf build/libs/XZHSurvivalPlugin-1.0.0.jar | grep -q 'villager-dialogue.yml'
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: XZHSurvivalPlugin-villager-bubble
          path: build/libs/XZHSurvivalPlugin-1.0.0.jar
          if-no-files-found: error
          retention-days: 90
