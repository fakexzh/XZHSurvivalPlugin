name: Build plugin
# CI rebuild trigger after correcting Paper API liquid checks.

on:
  push:
    branches: [main, feature/knockdown-revive-system, fix/creative-inventory-vanilla-drops-coin-chances]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Compile and package
        run: gradle --no-daemon clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalPlugin
          path: build/libs/*.jar
          if-no-files-found: error
