# Banglish village dialogue pack. Each story is a complete ordered sequence.
# Keep dialogue in Latin-script Banglish; never send these lines to normal server chat.
ambient-lines:
# Keep a smaller ambient pool so casual chatter stays varied without feeling constant.
  - "Kireh mama, ajke eto chupchap keno?"
  - "Bhai, cha khabi? Matha ekdom hang hoye ase."
  - "Ajke bajar e lokjon beshi re!"
  - "Ei rod e ber hoile mach-o shukiye jabe!"
  - "Tor khobor ki bhai? Onek din dekhi na."
  - "Kono khobor ache naki, shobai chup ken?"
  - "Bhai, amar pet e idur douraitese."
  - "Ajke kaaj kom, golpo beshi!"
  - "Ektu bosh, duniya niye alochona kori."
  - "Tor chehara dekhe mone hoy taka dhar lagbe."
  - "Bhai, ajke amar mood ekdom cha er moto."
  - "Ei gaon e shanti nai, shudhu gossip!"
  - "Tui ki shunli notun khobor?"
  - "Areh bhai, age cha, pore kaj."
  - "Amar matha ajke ekdom ghurghur kortese."
  - "Bazar e giya shobai dam niye juddho kore."
  - "Bhai, tor plan shunle amar ghum pai."
  - "Ajke hawa bhalo, golpo dewar perfect time."
  - "Kire, amake dekhe hashos keno?"
  - "Tor moto bondhu thakle shotru lage na!"
  - "Ajke ami khub serious... cha koi?"
  - "Bhai, amar hisab khata amar cheye beshi jane."
  - "Duniya chole taka diye, ar ami choli dhar diye."
  - "Ei rasta diye gele shobai amake chine!"
player-offers:
  - "Bhai fish lagbo? Matroi dhoira anlam!"
  - "Ekdom taja mach bhai, sokal sokal dhorsi!"
  - "Alu thakle den bhai, ami kinbo."
  - "Bhai, maal ache? ... Arey mach-shobji boltesi!"
  - "Bhai, ektu dekhen, dam kom rakhbo."
  - "Taja shobji lagbe? Bagan theke ashche."
  - "Bhai, ilish niben? Ajker catch!"
  - "Alu, peyaj, morich shob ase bhai."
  - "Bhai, apnar jonno special dam!"
  - "Ekbar dekhen bhai, na pochondo hoile niben na."
  - "Mach lagle dak diyen, ami kachei asi."
  - "Bhai, ajker shobji ekdom fresh."
  - "Baki na bhai, cash dile dam kom."
  - "Bhai, kinben naki shudhu dekhen?"
  - "Ektu daraen bhai, bhalo jinis dekhaitechi."

