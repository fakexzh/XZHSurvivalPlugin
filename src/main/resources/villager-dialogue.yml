# Banglish village dialogue pack. Each story is a complete ordered sequence.
# Keep dialogue in Latin-script Banglish; never send these lines to normal server chat.
ambient-lines:
  - "Kireh mama, ajke eto chupchap keno?"
  - "Bhai, cha khabi? Matha ekdom hang hoye ase."
  - "Ajke bajar e lokjon beshi re!"
  - "Ei rod e ber hoile mach-o shukiye jabe!"
  - "Tor khobor ki bhai? Onek din dekhi na."
  - "Kono khobor ache naki, shobai chup ken?"
  - "Bhai, amar pet e idur douraitese."
  - "Ajke kaaj kom, golpo beshi!"
  - "Ektu bosh, duniya niye alochona kori."
  - "Tor chehara dekhe mone hoy taka dhar lagbe."
  - "Bhai, ajke amar mood ekdom cha er moto."
  - "Ei gaon e shanti nai, shudhu gossip!"
  - "Tui ki shunli notun khobor?"
  - "Areh bhai, age cha, pore kaj."
  - "Amar matha ajke ekdom ghurghur kortese."
  - "Bazar e giya shobai dam niye juddho kore."
  - "Bhai, tor plan shunle amar ghum pai."
  - "Ajke hawa bhalo, golpo dewar perfect time."
  - "Kire, amake dekhe hashos keno?"
  - "Tor moto bondhu thakle shotru lage na!"
  - "Ajke ami khub serious... cha koi?"
  - "Bhai, amar hisab khata amar cheye beshi jane."
  - "Duniya chole taka diye, ar ami choli dhar diye."
  - "Ei rasta diye gele shobai amake chine!"
  - "Kintu keu baki taka dey na."
  - "Bhai, ekta bhalo khobor bol na."
  - "Ami ajke notun business shuru korbo... kalke theke."
  - "Bhai, tor kotha shunle mone hoy radio chalu hoise."
  - "Kono kaj nai? Taile gossip kori."
  - "Areh, eto tarahura kisher? Bajar palaitese naki?"

player-offers:
  - "Bhai fish lagbo? Matroi dhoira anlam!"
  - "Ekdom taja mach bhai, sokal sokal dhorsi!"
  - "Alu thakle den bhai, ami kinbo."
  - "Bhai, maal ache? ... Arey mach-shobji boltesi!"
  - "Bhai, ektu dekhen, dam kom rakhbo."
  - "Taja shobji lagbe? Bagan theke ashche."
  - "Bhai, ilish niben? Ajker catch!"
  - "Alu, peyaj, morich shob ase bhai."
  - "Bhai, apnar jonno special dam!"
  - "Ekbar dekhen bhai, na pochondo hoile niben na."
  - "Mach lagle dak diyen, ami kachei asi."
  - "Bhai, ajker shobji ekdom fresh."
  - "Baki na bhai, cash dile dam kom."
  - "Bhai, kinben naki shudhu dekhen?"
  - "Ektu daraen bhai, bhalo jinis dekhaitechi."

keyword-replies:
  "hello":
    - "Ki obostha bhai?"
    - "Kemon achen?"
    - "O bhai, bhalo achen?"
    - "Areh bhai, shagotom!"
  "hi":
    - "Ki obostha bhai?"
    - "Kemon achen?"
    - "Hi bhai, bajar ghurben?"
    - "Areh bhai!"
  "fish":
    - "Ache bhai, kom dame ditachi!"
    - "Mach ase bhai, ekdom taja!"
    - "Fish lagbe? Eikhane ashen!"
  "mach":
    - "Ache bhai, kom dame ditachi!"
    - "Mach ase bhai, ekdom taja!"
    - "Sokal bela dhorsi bhai!"
  "alu":
    - "Alu ase bhai, koy kilo lagbe?"
    - "Alu lagbe? Dam milaiya dibo."
    - "Alu ase, kintu damadami korte hobe!"
  "potato":
    - "Alu ase bhai, koy kilo lagbe?"
    - "Potato mane alu bhai, ase!"
  "price":
    - "Dam niye kotha bola jabe bhai."
    - "Bhai, age jinis dekhen tarpor dam!"
    - "Kom dam chai, naki taja jinis?"
  "dam":
    - "Dam niye kotha bola jabe bhai."
    - "Bhai, ektu damadami koren."
    - "Dam komabo, kintu pura loss dite parbo na!"
  "buy":
    - "Ki niben bhai? Dekhai!"
    - "Bhai, kinle bhalo jinis paben."
    - "Age dekhen, tarpor dam thik kori!"
  "sell":
    - "Ki bechen bhai? Amar lagte pare."
    - "Bhai, jinish thakle dekhan."
    - "Bikri korben? Dam niye boshbo!"
  "rumor":
    - "Bhai, notun gujob shunsi, kintu shob shotti na!"
    - "Age source dekhen, shudhu shune bishash korben na."
    - "Gaon e khobor ure, shotti aste deri kore!"
  "news":
    - "Ki khobor bhai? Bhalo kichu naki?"
    - "Ami-o notun khobor khujtesi!"
    - "Bajarer khobor lagle amare jigaiyen!"
  "hello!":
    - "Ki obostha bhai?"
    - "Kemon achen?"
  "kemon":
    - "Bhalo achi bhai, apnar ki obostha?"
    - "Alhamdulillah bhalo, cha khaben?"
  "ki obostha":
    - "Bhalo bhai, bajar choltese!"
    - "Din jacche bhai, taka ashe na!"

stories:
  - id: story-001
    title: "mach dhorar golpo 1"
    lines:
      - "Jano ki hoiche ajke?"
      - "Ki hoiche bhai?"
      - "Ajke nodir ghat e mach dhora korte giya pura bipod!"
      - "Ayhay, tarpor ki hoilo?"
      - "Ami nijer upor pani dhele felsi kore emon obostha korlam!"
      - "Tarpor bachla kemne?"
      - "Ami bhoy pai nai, shudhu pa duita nijer moto dour dise!"
      - "Dhuru miya, age bollei hoito!"
