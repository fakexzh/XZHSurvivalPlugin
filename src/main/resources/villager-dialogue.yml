stories:
  - id: story-0001
    title: "mach dhorar golpo 1"
    lines:
      - "Jano ki hoiche ajke?"
      - "Ki hoiche bhai?"
      - "Ajke nodir ghat e mach dhora korte giya pura bipod!"
      - "Ayhay, tarpor ki hoilo?"
      - "Ami nijer upor pani dhele felsi kore emon obostha korlam!"
      - "Tarpor bachla kemne?"
      - "Ami bhoy pai nai, shudhu pa duita nijer moto dour dise!"
      - "Dhuru miya, age bollei hoito!"
