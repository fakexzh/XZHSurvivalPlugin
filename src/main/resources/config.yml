tree-felling:
  enabled: true
  minimum-axe: WOODEN
  minimum-leaves: 6
  maximum-logs: 256
  require-sneak-to-disable: true

death:
  enabled: true
  xp-loss-min-percent: 25
  xp-loss-max-percent: 50
  overworld:
    keep-inventory: false
    no-home-penalty: 50
    minimum-bank-penalty: 10
    maximum-bank-penalty: 100
    distance-cap-blocks: 1000
  nether:
    keep-inventory: true
    minimum-bank-penalty: 100
    maximum-bank-penalty: 200
  end:
    keep-inventory: true
    minimum-bank-penalty: 200
    maximum-bank-penalty: 500

custom-time:
  # Disabled by default so existing worlds keep their normal daylight cycle until configured.
  enabled: false
  day-duration-seconds: 1800
  night-duration-seconds: 1800

tpa:
  timeout-seconds: 60
  nether-fixed-cost: 66
  prices:
    up-to-250: 10
    up-to-1000: 20
    up-to-3000: 30
    up-to-6000: 40
    up-to-10000: 50
    over-10000: 75
