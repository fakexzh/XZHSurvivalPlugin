tree-felling:
  enabled: true
  minimum-axe: WOODEN
  minimum-leaves: 6
  maximum-logs: 256
  require-sneak-to-disable: true

death:
  enabled: true
  xp-loss-min-percent: 25
  xp-loss-max-percent: 50
  overworld:
    keep-inventory: false
    no-home-penalty: 50
    minimum-bank-penalty: 10
    maximum-bank-penalty: 100
    distance-cap-blocks: 1000
  nether:
    keep-inventory: true
    minimum-bank-penalty: 100
    maximum-bank-penalty: 200
  end:
    keep-inventory: true
    minimum-bank-penalty: 200
    maximum-bank-penalty: 500

custom-time:
  # Disabled by default so existing worlds keep their normal daylight cycle until configured.
  enabled: false
  day-duration-seconds: 1800
  night-duration-seconds: 1800

# Individual progression is based on each player's accumulated online time.
progression:
  enabled: true
  level-2-hours: 2
  level-3-hours: 5
  level-4-hours: 10
  level-5-hours: 20
  player-detection-radius: 96
  equipment-chance-per-level: 0.09
  health-bonus-per-level: 0.05
  max-health-bonus: 0.10

tab:
  enabled: true

combat:
  target-range: 6
  damage-indicators:
    enabled: true
  target-health:
    enabled: true
