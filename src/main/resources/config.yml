# Independent Overworld day and night durations. Sleeping uses vanilla night-skip behavior.
custom-time:
  enabled: true
  day-duration-minutes: 20.0
  night-duration-minutes: 10.0
  # Empty means every loaded Overworld. Otherwise list exact world folder names.
  worlds: []

# Knockdown and player revival. All status/progress feedback is HUD-only (no chat messages).
knockdown:
  enabled: true
  duration-seconds: 60
  crawl-speed: 0.06
  revive:
    duration-seconds: 5
    range-blocks: 2.0
    health: 2.0
  effects:
    nausea-start-seconds: 8
    darkness-start-seconds: 20

# Replant mature crops from their harvest drops and award small vanilla XP orbs.
farming:
  enabled: true
  auto-replant: true
  xp-min: 1
  xp-max: 2

death:
  enabled: true
  xp-loss-min-percent: 25
  xp-loss-max-percent: 50
  overworld:
    keep-inventory: false
    no-home-penalty: 50
    minimum-bank-penalty: 10
    maximum-bank-penalty: 100
    distance-cap-blocks: 1000
  nether:
    keep-inventory: true
    minimum-bank-penalty: 100
    maximum-bank-penalty: 200
  end:
    keep-inventory: true
    minimum-bank-penalty: 200
    maximum-bank-penalty: 500

# Individual lifetime online playtime; level 1 at start, +1 per accumulated hour.
mob-progression:
  enabled: true
  hours-per-level: 1
  maximum-level: 25
  player-detection-range: 48.0
  equipment-chance-base: 0.08
  equipment-chance-per-level: 0.004
  maximum-equipment-chance: 0.45
  maximum-extra-health: 20.0
  speed-effect-start-level: 15
  special-abilities-start-level: 20
  special-block-building-enabled: true

adventure-loot:
  enabled: true
  mob-loot:
    enabled: true
    first-pickup-announcements: true
    common-extra-chance: 0.04
    rare-extra-chance: 0.005
    extreme-rare-chance: 0.0002
    coin-drop-chance: 0.08
    coin-10-chance: 0.025
    coin-100-chance: 0.001
    coin-1000-chance: 0.0001
    mob-coin-100-chance: 0.900
    mob-coin-1000-chance: 0.500
    multiple-coins-chance: 0.005
  fishing:
    enabled: true
    bonus-reward-chance: 0.20
    rare-reward-chance: 0.035
    extreme-rare-chance: 0.001
    coin-chance: 0.06
    quest-enabled: true
    quest-catches: 10
  exploration:
    village-chest-rewards-enabled: true
    village-chest-coin-chance: 0.12
    piglin-barter-coin-chance: 0.04
  pickup-messages:
    mob-loot-first-pickup-only: true
    coins-every-pickup: true
    coin-announcements-global: false

dynamic-trading:
  enabled: true
  refresh-minutes: 30
  villager:
    special-offer-purchases-per-refresh: 1
    player-sell-premium-min-percent: 5
    player-sell-premium-max-percent: 30
  wandering-trader:
    special-offer-purchases-per-refresh: 1
    player-sell-premium-min-percent: 5
    player-sell-premium-max-percent: 30
  compare-against-economy-shop: true
  prevent-buy-sell-arbitrage: true

# TAB player list and lightweight combat feedback.
combat-indicators:
  target-health-enabled: true
  target-range: 6.0

# Global boss challenges run on a fixed hourly schedule when enabled.
# Arena radius: 32 blocks. Nearby players get 10 seconds to enter before the arena locks.
# Entry fee: 100 bank coins. Rewards: Easy 350-500, Rare 500-1000, Legendary 1500-2500.
boss-challenge:
  enabled: true


# Breaking a villager's workstation releases the nearest matching villager and clears its trades.
villager-workstation-reset:
  enabled: true
  search-radius-blocks: 6.0
