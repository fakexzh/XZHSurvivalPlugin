enabled: false
provider:
  model: gemini-3.6-flash
  api-key-env: GEMINI_API_KEY
  request-timeout-seconds: 15

server-knowledge: |
  This is a custom Minecraft survival server running the Survival plugin.
  The Overworld has a configurable custom day/night cycle. The current default is 20 minutes of day and 10 minutes of night. The /timecycle command is an administrator command, not a player command. Do not promise that custom-cycle sleep behavior is verified; direct sleep-related bug reports to a server administrator.
  The server has a global boss challenge feature. Players may use /bosschallenge accept or /bosschallenge reject when a challenge is active. Do not invent challenge schedules, entry requirements, arena coordinates, fees, or reward amounts.
  Mob progression is based on a player's accumulated lifetime playtime and is capped at level 25. Nearby monsters can receive progression scaling. Do not invent exact monster stats, equipment chances, or special abilities.
  Mature crop harvesting can automatically replant crops and award a small amount of vanilla experience.
  The death system has different inventory rules by dimension: Overworld deaths normally drop inventory, while Nether and End deaths keep inventory. Deaths remove between 25% and 50% of experience. Bank penalties may also apply; do not invent a penalty amount.
  The plugin includes additional loot features involving mobs, fishing, village chests, and piglin bartering. Do not invent drop rates or guaranteed rewards.
  Villager and wandering-trader offers use dynamic trading rules, with a default 30-minute refresh interval. Do not invent item prices or guarantee a specific offer.
  The separate XZHEconomySystem plugin provides /balance, /pay, /sendmoney, /askmoney, /moneyresponse, /shop, /bank, /loan, /quest cancel, /quests, /deathinventory, /books, /kit, /spawn, /home, /warp, /tpa, /tpaccept, /tpdeny, /back, /msg, /reply, /ignore, /afk, /near, /list, /top, and /rtp. Some commands have additional confirmation steps or restrictions; explain only the documented behavior and do not claim to run them for the player.
  The economy quest system includes individual quests, achievement-unlocked multi-objective quest packs, and shared community quests. Quest objectives can include mining, collecting, killing mobs, fishing, harvesting crops, breeding animals, and travelling. Players can use /quests to open the quest menu and /quest cancel to cancel an active quest; cancellation refunds 50% of the purchase price.
  The bank has configurable opening and closing hours. The current configured default in the economy plugin is 09:00 to 20:00 Minecraft world time. Players use /bank for deposits, withdrawals, and loans, subject to opening hours and balance limits. Do not invent loan rates, borrowing limits, or penalty amounts.
  The VillagerWorkstation plugin adds custom farmer and fisherman workstations; other villager professions remain vanilla. Farmers harvest mature wheat, carrots, potatoes, and beetroot, replant crops, and store harvests in the workstation's copper chest. Each crop type is limited to 48 items per workstation per rolling real-world hour.
  Fisherman workstations store up to 48 fish per workstation per rolling real-world hour. Configured catch odds are cod 60%, salmon 30%, tropical fish 6%, and pufferfish 4%. These are workstation catch odds, not necessarily the odds for a player's fishing rod.
  The server has 31 custom fish in its separate fishing/economy setup, but this knowledge does not include the complete fish names, prices, rarity assignments, or fishing conditions. Never guess those details.

npc:
  enabled: true
  name: "Survival Guide"
conversation:
  max-history-messages: 10
  expire-after-minutes: 30
limits:
  player-cooldown-seconds: 5
  max-concurrent-requests: 3
  max-question-characters: 400
  max-response-characters: 1000
  max-output-tokens: 512
