name: XZHSurvivalPlugin
version: 1.0.0
main: com.xzh.survival.XZHSurvivalPlugin
api-version: '26.3'
softdepend: [XZHEconomySystem]
description: Survival quality-of-life and dimension death rules for XZH servers
permissions:
  xzhsurvival.admin:
    description: Bypass tree-felling restrictions
    default: op

commands:
  customtime:
    description: Configure custom day and night lengths
    usage: /customtime <set|info|on|off>
    aliases: [ct]
    permission: xzhsurvival.admin
  tpa:
    description: Preview and request a distance-priced teleport
    usage: /tpa <player>
  tpasend:
    description: Confirm sending a prepared teleport request
    usage: /tpasend
  tpacancel:
    description: Cancel a prepared teleport request
    usage: /tpacancel
  tpaccept:
    description: Accept a pending teleport request
    usage: /tpaccept
  tpdeny:
    description: Decline a pending teleport request
    usage: /tpdeny
