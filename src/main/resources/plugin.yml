name: Survival
version: 1.0.0
main: com.xzh.survival.XZHSurvivalPlugin
api-version: '26.3'
softdepend: [GSit, XZHEconomySystem]
description: Survival gameplay features, knockdown and dimension death rules

commands:
  timecycle:
    description: Manage independent day and night durations
    usage: /timecycle <status|day|night|setday|setnight|pause|resume|reload|reset>

permissions:
  survival.timecycle.admin:
    description: Allows managing the custom day and night cycle
    default: op
