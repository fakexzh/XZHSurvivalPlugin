name: Survival
version: 1.0.0
main: com.xzh.survival.XZHSurvivalPlugin
api-version: '26.3'
softdepend: [XZHEconomySystem]
description: Survival gameplay features and dimension death rules

commands:
  boss:
    description: Spawn a boss for an arena encounter
    usage: /boss <bossname|easy|rare|legendary|enable|disable>
    permission: xzhsurvival.boss.admin
  sorry:
    description: Surrender your active boss challenge
    usage: /sorry
  bosschallenge:
    description: Accept or reject a global boss challenge
    usage: /bosschallenge <accept|reject>
  timecycle:
    description: Manage independent day and night durations
    usage: /timecycle <status|day|night|setday|setnight|pause|resume|reload|reset>
    permission: survival.timecycle.admin

permissions:
  survival.timecycle.admin:
    description: Allows managing the custom day and night cycle
    default: op
  xzhsurvival.boss.admin:
    description: Allows manually spawning boss encounters
    default: op
