name: Survival
version: 1.0.0
main: com.xzh.survival.XZHSurvivalPlugin
api-version: '26.3'
softdepend: [GSit, XZHEconomySystem]
description: Survival gameplay features, knockdown and dimension death rules

commands:
  timecycle:
    description: Manage independent day and night durations
    usage: /timecycle <status|day|night|setday|setnight|pause|resume|reload|reset>
  fly:
    description: Toggle your flight or grant flight to an online player
    usage: /fly [player]
  unfly:
    description: Revoke an online player's flight ability
    usage: /unfly <player>
  gmc:
    description: Set yourself or a player to Creative
    usage: /gmc [player]
  gms:
    description: Set yourself or a player to Survival
    usage: /gms [player]
  gma:
    description: Set yourself or a player to Adventure
    usage: /gma [player]
  gmsp:
    description: Set yourself or a player to Spectator
    usage: /gmsp [player]
  gamemode:
    description: Change gamemode
    usage: /gamemode <mode> [player]
    aliases: [gm]
  day:
    description: Set the current world to day
    usage: /day
  night:
    description: Set the current world to night
    usage: /night
  heal:
    description: Restore health
    usage: /heal [player]
  feed:
    description: Restore hunger
    usage: /feed [player]
  weather:
    description: Change weather
    usage: /weather <clear|rain|thunder>
  xzhpower:
    description: Grant or revoke session-only admin powers
    usage: /xzhpower <give|revoke|list|clear> <player> [power]

# Admin flight controls are available to operators by default.
permissions:
  survival.timecycle.admin:
    description: Allows managing the custom day and night cycle
    default: op

  survival.admin.commands:
    description: Allows using all Survival administrative commands and managing temporary powers
    default: op
