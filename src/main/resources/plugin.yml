name: Survival
version: 1.0.0
main: com.xzh.survival.XZHSurvivalPlugin
api-version: '26.3'
softdepend: [GSit, XZHEconomySystem]
description: Survival gameplay features, knockdown and dimension death rules

commands:
  timecycle:
    description: Manage independent day and night durations
    usage: /timecycle <status|day|night|setday|setnight|pause|resume|reload|reset>
  fly:
    description: Grant a player permission to fly
    usage: /fly <player>
    permission: survival.admin.fly
  unfly:
    description: Revoke a player's ability to fly
    usage: /unfly <player>
    permission: survival.admin.unfly

# Admin flight controls are available to operators by default.
permissions:
  survival.timecycle.admin:
    description: Allows managing the custom day and night cycle
    default: op

  survival.admin.fly:
    description: Allows granting flight ability to other players
    default: op
  survival.admin.unfly:
    description: Allows revoking flight ability from other players
    default: op
